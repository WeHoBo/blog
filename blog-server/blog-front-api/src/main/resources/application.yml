app:
  base-url: http://localhost:8080
  web-url: http://localhost:3000
  cors:
    # 逗号分隔的跨域白名单（生产前端与接口同源，实际不触发跨域，主要用于本地开发）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://codeup.asia,https://www.codeup.asia}

ai:
  rag-url: ${RAG_URL:http://127.0.0.1:8000}
  # 与 RAG 服务共享的调用令牌；需与 rag_system/backend/.env 的 RAG_API_TOKEN 一致
  rag-token: ${RAG_API_TOKEN:}
  # 当前生效的模型标识，随请求透传给 RAG，用于用量归属。
  # P2 起以数据库 ai_model / ai_setting 为准，这里只是注册表不可用时的兜底默认值。
  model-code: ${AI_MODEL_CODE:deepseek-chat}
  # 后台填写的模型密钥用 AES-256-GCM 加密后入库，主密钥来自这里。
  # ⚠️ 一旦更换，已入库的密钥全部无法解密（后台需要重新填一遍），请按"长期不变"对待。
  # 为空时后台不允许"直接填写密钥"，只能用 apiKeyEnv 模式（密钥留在环境变量里）。
  key-secret: ${AI_KEY_SECRET:}
  # 单价：元 / 百万 token。按厂商现价填，调价时同步改这里（历史账单已快照，不会被改写）
  price:
    input: ${AI_PRICE_INPUT:2.0}
    output: ${AI_PRICE_OUTPUT:8.0}
  # 配额：三层窗口 + IP 兜底。任一置 0 表示该层不限制；管理员始终不受限（但仍记账）
  limits:
    enabled: ${AI_LIMITS_ENABLED:true}
    minute: ${AI_LIMIT_MINUTE:5}
    hourly: ${AI_LIMIT_HOURLY:30}
    daily: ${AI_LIMIT_DAILY:100}
    ip-daily: ${AI_LIMIT_IP_DAILY:300}

server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      # 生产必须设置 REDIS_PASSWORD（或 application-prod.yml 的 spring.data.redis.password），
      # 并与 redis.conf 的 requirepass 一致。为空则不启用 AUTH（仅适合本机开发）。
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    async:
      # AI 流式回答可能持续数分钟；Spring MVC 默认异步超时 30s，超时会把已开始的流式响应直接掐断
      request-timeout: 300s

logging:
  # 日志文件目录：logback-spring.xml 通过 springProperty 读取此值。
  # 生产环境在 application-prod.yml 覆盖为 /opt/blog/logs（该目录须对运行用户可写）。
  file:
    path: ${LOG_PATH:./logs}
  level:
    com.blog.common.mapper: WARN
    org.mybatis: WARN
    org.mybatis.spring: WARN

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blog.common.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: front
      paths-to-match: /api/front/**
      packages-to-scan: com.blog.front.controller

jwt:
  # 此默认值仅供本地开发。生产必须在 application-prod.yml / 环境变量 JWT_SECRET 中覆盖。
  # JwtUtils 启动时会校验：缺失、空白或短于 32 字节一律直接启动失败。
  secret: ${JWT_SECRET:blog-dev-only-secret-0123456789abcdef0123456789abcdef}
  expiration: 86400000

file:
  upload:
    path: ./uploads
    base-url: /uploads

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    proxy-host: 127.0.0.1
    proxy-port: 7890
  gitee:
    client-id: ${GITEE_CLIENT_ID:}
    client-secret: ${GITEE_CLIENT_SECRET:}
  huawei:
    client-id: ${HUAWEI_CLIENT_ID:}
    client-secret: ${HUAWEI_CLIENT_SECRET:}

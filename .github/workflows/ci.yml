name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn test -pl blog-front-api -am

  frontend:
    name: Frontend (Vitest + Nuxt build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

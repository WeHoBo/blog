name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn test -pl blog-front-api -am

  frontend:
    name: Frontend (Vitest + Nuxt build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prepare Nuxt
        # blog-web/tsconfig.json 只有 "extends": "./.nuxt/tsconfig.json"，
        # 而 .nuxt/ 被 gitignore，CI 全新 checkout 时不存在该文件，
        # 会导致 vite:oxc 报 [TSCONFIG_ERROR] Tsconfig not found 而测试直接失败。
        # 先让 Nuxt 生成 .nuxt/tsconfig.json 再跑测试。
        run: npx nuxi prepare
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

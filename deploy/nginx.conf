server {
    listen 80;
    server_name codeup.asia www.codeup.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name codeup.asia www.codeup.asia;

    ssl_certificate /etc/letsencrypt/live/codeup.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeup.asia/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # 图片/附件上传最大 20MB。Nginx 默认 1m，会让稍大的图片直接 413。
    client_max_body_size 20m;

    # AI 流式问答：必须关闭响应缓冲，否则 Nginx 会攒满缓冲才下发，
    # 首字节前超出 proxy_read_timeout（默认 60s）会被掐断。
    # 该 location 比 /api/ 更具体，匹配优先级更高。
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台上传到本地磁盘的图片由 Spring Boot 的 /uploads/** 资源处理器提供。
    # 若不代理，请求会落到 / 的 Nuxt(3000) 上并 404（历史 bug：上传图片线上打不开）。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

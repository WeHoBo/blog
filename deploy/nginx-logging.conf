# =============================================================================
# nginx 日志格式（带耗时）
# -----------------------------------------------------------------------------
# 放哪里：/etc/nginx/conf.d/00-log-format.conf
#   必须是 http 上下文 —— conf.d/*.conf 正好在 http{} 里，所以直接扔进去即可。
#   ⚠️ 不要写进站点文件 deploy/nginx.conf，那个文件是 server{} 片段，放 log_format 会语法报错。
#
# 为什么需要这个文件：
#   nginx 默认的 combined 格式**不含 $request_time**，也就是说线上到底哪个接口慢，
#   nginx 侧根本看不出来。加上这两个变量之后，"慢" 可以分成两种：
#     $request_time          —— 客户端感知的总耗时（含 nginx 排队、网络）
#     $upstream_response_time —— 后端自己的耗时
#   两者差得多 = 卡在 nginx/网络；两者接近且都大 = 后端慢。
#
# 生效方式：nginx -t && nginx -s reload
# =============================================================================

map $upstream_http_x_request_id $blog_log_request_id {
    ""      $request_id;
    default $upstream_http_x_request_id;
}

log_format main_timed '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      '"$http_referer" "$http_user_agent" '
                      'rid=$blog_log_request_id';
